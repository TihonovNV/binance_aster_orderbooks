[package]
name = "binance_aster_orderbooks"
version = "0.1.0"
edition = "2024"

[lib]
name = "orderbooks"

[[bin]]
name = "orderbooks"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
fastrand = "2.5.0"
hdrhistogram = "7.6.0"
quanta = "0.13.0"
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sonic-rs = "0.5.10"
tokio = { version = "1.54.0", features = ["rt", "net", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
ureq = "3.4.2"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.12.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = 1

[profile.bench]
inherits = "release"

[[bench]]
name = "book"
harness = false
